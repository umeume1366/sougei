<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送迎マップ - デイサービス配車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a73e8;--blue-d:#1765cc;--blue-l:#e8f0fe;--ink:#202124;--ink2:#3c4043;--sub:#5f6368;--line:#dadce0;--line2:#e8eaed;
  --bg:#fff;--hover:#f1f3f4;--red:#d93025;--red-l:#fce8e6;--green:#188038;--green-l:#e6f4ea;--amber:#e37400;
  --shadow:0 2px 4px rgba(0,0,0,.2),0 -1px 0 rgba(0,0,0,.02);--shadow2:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --panel:408px;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px/1.45 Roboto,"Noto Sans JP",Arial,sans-serif;color:var(--ink);background:#e5e3df}
button,input,select,textarea{font:inherit;color:inherit}
#map{position:absolute;inset:0}

/* ---------- 検索ボックス (Googleマップ風) ---------- */
.search{position:absolute;z-index:30;top:12px;left:12px;width:calc(var(--panel) - 24px);height:48px;background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 4px}
.search input{flex:1;border:0;outline:0;height:100%;font-size:15px;padding:0 4px;background:transparent}
.ibtn{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--sub);flex:none}
.ibtn:hover{background:var(--hover)}
.ibtn svg{width:22px;height:22px;fill:currentColor}
.sresults{position:absolute;top:56px;left:0;right:0;background:#fff;border-radius:8px;box-shadow:var(--shadow2);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.sresults.on{display:block}
.sresults button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:#fff;padding:10px 16px;cursor:pointer;align-items:center}
.sresults button:hover{background:var(--hover)}
.sresults small{color:var(--sub);display:block}

/* ---------- 上部チップ ---------- */
.chips{position:absolute;z-index:20;top:18px;left:calc(var(--panel) + 12px);right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;transition:left .2s}
body.collapsed .chips{left:calc(var(--panel) + 12px)}
.chip{height:34px;padding:0 14px;border-radius:17px;border:0;background:#fff;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--ink2)}
.chip:hover{background:#f8f9fa}
.chip svg{width:18px;height:18px;fill:currentColor}
.chip.primary{background:var(--blue);color:#fff}.chip.primary:hover{background:var(--blue-d)}
.chip input[type=date]{border:0;outline:0;background:transparent;font-weight:500}
.seg{display:inline-flex;background:#fff;border-radius:17px;box-shadow:var(--shadow);overflow:hidden;height:34px}
.seg button{border:0;background:#fff;padding:0 16px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--blue-l);color:var(--blue)}

/* ---------- サイドパネル ---------- */
.panel{position:absolute;z-index:10;top:0;left:0;bottom:0;width:var(--panel);background:#fff;box-shadow:var(--shadow2);display:flex;flex-direction:column;transition:transform .2s}
body.collapsed .panel{transform:translateX(calc(-1 * var(--panel)))}
body.collapsed .chips{left:12px;top:72px}
body.collapsed .search{box-shadow:var(--shadow)}
.ptoggle{position:absolute;z-index:11;top:50%;left:var(--panel);width:23px;height:48px;margin-top:-24px;border:0;border-left:1px solid var(--line2);background:#fff;border-radius:0 8px 8px 0;box-shadow:0 1px 2px rgba(60,64,67,.3);cursor:pointer;display:grid;place-items:center;transition:left .2s}
body.collapsed .ptoggle{left:0}
.ptoggle svg{width:20px;height:20px;fill:var(--sub);transition:transform .2s}
body.collapsed .ptoggle svg{transform:rotate(180deg)}
.phead{padding-top:72px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line2);padding:0 8px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 9px;cursor:pointer;color:var(--sub);font-weight:500;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tabs button svg{width:22px;height:22px;fill:currentColor}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain}
.view{display:none}.view.on{display:block}
.sec{padding:16px 20px;border-bottom:1px solid var(--line2)}
.sec h2{font-size:22px;font-weight:400;margin:0 0 4px;font-family:"Google Sans",Roboto,"Noto Sans JP",sans-serif}
.sec h3{font-size:15px;font-weight:500;margin:0 0 10px}
.muted{color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.btn{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--blue);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f6fafe;border-color:#d2e3fc}
.btn.fill{background:var(--blue);border-color:var(--blue);color:#fff}.btn.fill:hover{background:var(--blue-d)}
.btn.danger{color:var(--red)}
.btn svg{width:18px;height:18px;fill:currentColor}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line2)}
.round{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;color:var(--blue);font-size:12px;font-weight:500;width:64px}
.round span{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.round.fill span{background:var(--blue);border-color:var(--blue);color:#fff}
.round svg{width:20px;height:20px;fill:currentColor}
.round:hover span{background:var(--blue-l)}.round.fill:hover span{background:var(--blue-d)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}
.kpi b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.alert{margin:12px 20px 0;padding:10px 12px;border-radius:8px;background:var(--red-l);color:#a50e0e;font-size:13px}
.alert.ok{background:var(--green-l);color:#0d652d}
.alert ul{margin:4px 0 0;padding-left:18px}

/* 車両カード */
.vcard{border-bottom:1px solid var(--line2)}
.vhead{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;cursor:pointer}
.vdot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 4px currentColor}
.vhead b{font-size:15px;font-weight:500}
.vhead .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.trip{padding:0 20px 12px 20px}
.triphead{font-size:12px;color:var(--sub);margin:6px 0 2px 34px;display:flex;gap:8px;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;position:relative}
.tl li::before{content:"";position:absolute;left:11px;top:0;bottom:0;border-left:3px dotted var(--c,#9aa0a6)}
.tl li:first-child::before{top:50%}.tl li:last-child::before{bottom:50%}
.tl .n{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.tl .n.dep{background:#fff;border:3px solid var(--c);width:20px;height:20px;margin:2px}
.tl .nm{font-weight:500}
.tl .ad{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tm{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tl .tm small{display:block;color:var(--sub);font-size:11px}
.tl li.stop{cursor:pointer;border-radius:6px}
.tl li.stop:hover{background:var(--hover)}
.tag{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;background:var(--line2);color:var(--ink2);margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.wc{background:#e8f0fe;color:var(--blue)}
.tag.bad{background:var(--red-l);color:var(--red)}
@media (hover:hover){.tl li .mv{opacity:0;transition:opacity .1s}.tl li:hover .mv,.tl li .mv:focus{opacity:1}}
.mv{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 2px;margin-top:2px;max-width:120px;background:#fff}

/* リスト */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:center;padding:10px 20px;cursor:pointer;border-bottom:1px solid var(--line2)}
.list li:hover{background:var(--hover)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:500;color:#fff;flex:none;background:#8ab4f8}
.list .t{flex:1}
.list .t b{font-weight:500;display:block}
.list .t small{color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off{opacity:.45}
.switch{appearance:none;width:36px;height:20px;border-radius:10px;background:#bdc1c6;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch:checked{background:var(--blue)}.switch:checked::after{left:18px}
.filter{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.fchip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--ink2)}
.fchip.on{background:var(--blue-l);border-color:var(--blue-l);color:var(--blue)}

/* フォーム */
.form{padding:8px 20px 24px}
.form label{display:block;margin-top:14px;font-size:12px;color:var(--sub);font-weight:500}
.form input[type=text],.form input[type=number],.form input[type=time],.form input[type=password],.form select,.form textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px;font-size:15px;background:#fff;margin-top:4px}
.form textarea{height:64px;padding:8px 12px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.days{display:flex;gap:4px;margin-top:6px}
.days label{margin:0}
.days input{display:none}
.days span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);cursor:pointer;color:var(--ink2);font-weight:500}
.days input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.check{display:flex!important;gap:8px;align-items:center;font-size:14px!important;color:var(--ink)!important}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.formhead{display:flex;align-items:center;gap:4px;padding:8px 8px 0}
.formhead h3{margin:0;font-size:18px;font-weight:400}
.formfoot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--blue);margin-top:16px;font-weight:500}

/* 地図上の凡例 */
.legend{position:absolute;z-index:5;bottom:24px;left:calc(var(--panel) + 12px);display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - var(--panel) - 80px);transition:left .2s}
body.collapsed .legend{left:12px}
.legend button{height:30px;border-radius:15px;border:0;background:#fff;box-shadow:var(--shadow);padding:0 12px 0 8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:500}
.legend button i{width:12px;height:12px;border-radius:50%}
.legend button.hide{opacity:.5;text-decoration:line-through}

/* トースト・モーダル */
.toast{position:absolute;z-index:60;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#323232;color:#fff;padding:12px 20px;border-radius:4px;box-shadow:var(--shadow2);transition:transform .25s;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(32,33,36,.6);display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:8px;box-shadow:var(--shadow2);width:min(960px,100%);max-height:100%;display:flex;flex-direction:column}
.mbox header{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 24px;border-bottom:1px solid var(--line2)}
.mbox header h3{margin:0;font-weight:400;font-size:20px;flex:1}
.mbox .mc{overflow:auto;padding:16px 24px}
table.sheet{border-collapse:collapse;width:100%;font-size:13px}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.sheet th{background:#f8f9fa;font-weight:500;white-space:nowrap}
table.sheet td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
table.sheet tr.vh td{background:#f1f3f4;font-weight:500}
.busy{position:absolute;z-index:65;inset:0;background:rgba(255,255,255,.5);display:none;place-items:center}
.busy.on{display:grid}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}*{transition:none!important}}
.pickmode #map{cursor:crosshair}
.pickbar{position:absolute;z-index:40;top:72px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:24px;display:none;gap:12px;align-items:center;box-shadow:var(--shadow2)}
.pickmode .pickbar{display:flex}
.pickbar button{background:transparent;border:0;color:#8ab4f8;font-weight:500;cursor:pointer}

/* 簡易地図 */
.smap{position:absolute;inset:0;background:#f8f9fa;overflow:hidden;touch-action:none}
.smap svg{width:100%;height:100%;display:block}
.smap .note{position:absolute;right:60px;bottom:24px;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:4px;font-size:12px;color:var(--sub);box-shadow:var(--shadow)}
.zoom{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:40px;height:40px;border:0;background:#fff;cursor:pointer;font-size:22px;color:var(--sub)}
.zoom button+button{border-top:1px solid var(--line2)}
.gm-pin{transform:translateY(0)}
.mk{width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px/22px Roboto,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.mk.hl{transform:scale(1.35);z-index:9}
.mk.plain{background:#5f6368}

@media (max-width:760px){
  :root{--panel:100vw}
  .search{width:calc(100vw - 24px)}
  .chips{top:auto;bottom:12px;left:12px!important}
  body:not(.collapsed) .chips,body:not(.collapsed) .legend{display:none}
  .ptoggle{display:none}
  .panel{top:auto;height:62vh;border-radius:16px 16px 0 0}
  .phead{padding-top:8px}
  body.collapsed .panel{transform:translateY(calc(62vh - 56px))}
  .mobbar{display:flex!important}
}
.mobbar{display:none;justify-content:center;padding:6px 0 0}
.mobbar button{width:40px;height:5px;border-radius:3px;background:var(--line);border:0;cursor:pointer}

@media print{
  body *{visibility:hidden}
  #sheetModal,#sheetModal *{visibility:visible}
  #sheetModal{position:absolute;inset:0;background:#fff;padding:0;display:block}
  #sheetModal header button{display:none}
  .mbox{box-shadow:none;width:100%}
  html,body{overflow:visible;height:auto}
}
.maplibregl-ctrl-attrib{font:11px Roboto,"Noto Sans JP",sans-serif}
.maplibregl-ctrl-group{border-radius:8px!important;box-shadow:var(--shadow)!important}
.maplibregl-ctrl-group button{width:40px!important;height:40px!important}
.maplibregl-popup-content{border-radius:8px;box-shadow:var(--shadow2);padding:10px 14px}
.maplibregl-marker .mk{cursor:pointer}
.baseseg{position:absolute;z-index:5;left:calc(var(--panel) + 12px);bottom:62px;display:inline-flex;background:#fff;border-radius:8px;box-shadow:var(--shadow);overflow:hidden;transition:left .2s}
.baseseg button{border:0;background:#fff;height:32px;padding:0 12px;cursor:pointer;font-weight:500;color:var(--ink2);font-size:12px}
.baseseg button.on{background:var(--blue-l);color:var(--blue)}
body.collapsed .baseseg{left:12px}
@media (max-width:760px){body:not(.collapsed) .baseseg{display:none}.baseseg{bottom:56px}}
</style>
</head>
<body>
<div id="map"></div>

<div class="search">
  <button class="ibtn" id="menuBtn" title="パネルの開閉" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <input id="q" type="text" placeholder="利用者名・住所で検索" autocomplete="off" aria-label="検索">
  <button class="ibtn" id="qBtn" title="検索" aria-label="検索"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  <div class="sresults" id="sres"></div>
</div>

<div class="chips">
  <div class="seg" role="tablist" aria-label="迎え・送り">
    <button id="dirPick" class="on">迎え</button><button id="dirDrop">送り</button>
  </div>
  <label class="chip"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg><input type="date" id="date" aria-label="送迎日"></label>
  <span class="chip" id="timeChip" title="設定で変更できます"></span>
  <button class="chip primary" id="optBtn"><svg viewBox="0 0 24 24"><path d="M21.71 11.29l-9-9a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 0 1.42l9 9a1 1 0 0 0 1.42 0l9-9a1 1 0 0 0 0-1.42zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>配車を最適化</button>
  <button class="chip" id="sheetBtn"><svg viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8v5zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-1-9H6v4h12V3z"/></svg>送迎表</button>
</div>

<aside class="panel" id="panel">
  <div class="phead">
    <div class="mobbar"><button id="mobToggle" aria-label="パネルの開閉"></button></div>
    <nav class="tabs">

      <button data-v="users"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>利用者</button>
